[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyray"
version = "0.1.0"
description = "Ray Dalio-style debt-cycle & growth/inflation regime engine (v1 composite + 5-engine v2 architecture) for market-data-hub."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Marco Selva" }]
dependencies = [
    "hmmlearn>=0.3,<0.4",   # stress monitor: 3-state Gaussian HMM (lazyray/stress/regimes.py)
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy",
    "pyyaml",
    "filelock>=3.0",
    # market-data-hub is a private, git-installed package (dependency
    # confusion exposure if pinned to a bare PyPI name). See
    # docs/ECOSYSTEM_RATIONALIZATION.md in market-data-hub for the
    # extraction rationale and LazyFin's identical pin pattern.
    #
    # Re-aligned (ecosystem stabilization plan, ECO-007) from the stale
    # @42ed9ea pin -- which had diverged from the combination every other
    # consumer verifies against -- to the commit that shipped the
    # lazydatacore schema/contract governance work (Train B). Both
    # functions this package calls (reader.read_macro_panel_ext,
    # config_loader.get_countries) are unchanged at the new pin; the full
    # test suite (69 tests) passes against it unmodified.
    #
    # Re-aligned again 2026-08-15, from @0eb286e4 to the commit the deployment
    # actually runs. The old pin had drifted 47 commits behind, and nothing
    # noticed because nothing honoured it: the scheduled jobs read
    # market_data_hub from a development checkout sitting on main, so the pin
    # described a combination no one was running or testing. Rebuilding the
    # environments without that leak made the two disagree out loud, as a
    # resolution conflict, which is the first time this pin has been checked
    # by anything other than reading it.
    #
    # Both functions are unchanged at the new pin -- same file, same line, same
    # signature -- and nothing here imports market_data_hub.regime, which
    # 5b515c0 removed on the way.
    "market-data-hub @ git+https://github.com/selvaz/market-data-hub.git@636b38a7f9039113b935315fbf5f205ff9180160",
]

[project.optional-dependencies]
# send_telegram_report.py only. LazyTools is public (distribution
# `lazytoolkit`) and pinned to the compatibility manifest's ref. Deliberately
# without a python_version marker: LazyTools requires >= 3.11, and asking for
# this extra on 3.9 or 3.10 must fail loudly rather than install nothing and
# leave the send broken at runtime. The core, the tests and --dry-run never
# import it.
telegram = ["lazytoolkit[telegram] @ git+https://github.com/selvaz/LazyTools.git@v0.6.0"]

dev = [
    "pytest>=7.0", "pytest-cov>=4.0", "pytest-randomly>=3.12", "ruff<0.16", "pip-audit",
    "mypy>=1.8", "types-requests", "types-PyYAML",
    "typing_extensions",
]

[tool.mypy]
files = ["lazyray"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
include = ["lazyray*"]

[tool.setuptools.package-data]
lazyray = ["config/*.yaml", "db/*.sql"]

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint (ruff — default rule set)
        run: ruff check .

      - name: Validate config
        run: python validate_config.py

      # mypy 2.x itself requires Python >=3.10 to run; run it once, on the
      # newest leg, matching market-data-hub's own ci.yml constraint.
      - name: Type check (mypy)
        if: matrix.python-version == '3.12'
        run: mypy

      - name: Dependency audit (advisory, non-blocking)
        continue-on-error: true
        run: pip-audit

      - name: Byte-compile all modules
        run: python -m compileall -q lazyray *.py

      # Same regression class market-data-hub's ci.yml guards against: a
      # subpackage (dalio_v2) silently missing from a real (non-editable)
      # wheel while `pip install -e .` hides the gap.
      - name: Verify the package actually installs (not just editable)
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist .
          python -m venv /tmp/install-check
          # Install the wheel and let it pull market-data-hub via its own
          # pyproject dependency (the pinned git ref). Do NOT re-install the
          # hub at a separate pin here: a stale explicit pin would override the
          # wheel's declared dependency and mask regressions that only appear
          # against the real pinned commit.
          /tmp/install-check/bin/pip install --quiet dist/*.whl \
            --find-links dist
          /tmp/install-check/bin/python -c "
          import lazyray, lazyray.dalio, lazyray.classify
          import lazyray.dalio_v2.runner, lazyray.dalio_v2.cycle_classifier
          import lazyray.dalio_v2.sovereign_solvency, lazyray.dalio_v2.scoring
          import lazyray.db.connection
          print('package installs and imports cleanly')
          "

      - name: Run tests (randomized order, with coverage)
        run: |
          pytest -q --durations=15 \
            --cov=lazyray --cov-report=term-missing --cov-fail-under=60

  # The `telegram` extra is the only thing that pulls LazyTools, and the matrix
  # above deliberately never installs it: the whole point of D16 is that the
  # core, the tests and --dry-run work without it. So it gets its own job,
  # which is also the only place the extra's own installability is proven —
  # a broken git ref would otherwise stay invisible until someone tried to send.
  #
  # 3.12 only: LazyTools requires >= 3.11, and the extra has no marker on
  # purpose, so asking for it on 3.9 or 3.10 must fail rather than quietly
  # install nothing.
  telegram-extra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the telegram extra
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,telegram]"
      - name: Both sides of the boundary import
        run: |
          python -c "
          from lazytools.connectors.telegram import TelegramClient
          import send_telegram_report
          print('connector and sender import together:', TelegramClient.__name__)
          "
      - name: The sender's own tests
        run: pytest -q tests/test_send_telegram_report.py
